<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Patrick+Hand&family=Gloria+Hallelujah&family=Kalam:wght@400&family=Shadows+Into+Light&family=Permanent+Marker&family=Architects+Daughter&family=Gaegu:wght@400&family=Marhey:wght@400&family=Aref+Ruqaa+Ink&family=Reem+Kufi+Ink&display=block" rel="stylesheet">
<style>
body{margin:0;padding:18px 28px;background:#2a0f0c url() ;background:radial-gradient(circle at 60% 40%,#7a2418,#1a0805 75%);color:#fff;font-family:sans-serif}
.row{display:flex;align-items:baseline;gap:20px;margin:4px 0;filter:url(#boil)}
.n{font:600 15px sans-serif;width:30px;opacity:.7;filter:none}
.t{font-size:46px;text-shadow:0 0 6px rgba(0,0,0,.6),0 2px 12px rgba(0,0,0,.4)}
.lab{font:13px sans-serif;opacity:.55}
h3{margin:14px 0 4px;font:600 16px sans-serif;opacity:.8}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="boil"><feTurbulence id="tb" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<h3>English</h3>
<div id="en"></div>
<h3>عربي</h3>
<div id="ar"></div>
<script>
const en=[['1','Caveat'],['2','Patrick Hand'],['3','Gloria Hallelujah'],['4','Kalam'],['5','Shadows Into Light'],['6','Permanent Marker'],['7','Architects Daughter'],['8','Gaegu']];
const ar=[['A','Marhey'],['B','Aref Ruqaa Ink'],['C','Reem Kufi Ink']];
const mk=(id,list,text,dir)=>{const c=document.getElementById(id);for(const[n,f]of list){const r=document.createElement('div');r.className='row';r.dir=dir;r.innerHTML=`<span class=n>${n}</span><span class=t style="font-family:'${f}'">${text}</span><span class=lab>${f}</span>`;c.append(r)}};
mk('en',en,'Ooh, the more I get of you','ltr');mk('ar',ar,'انت عمري وانت حياتي','rtl');
const s=[3,17,42];let i=0;setInterval(()=>document.getElementById('tb').setAttribute('seed',s[++i%3]),140);
</script></body></html>
